name: tests

on:
  push:
  pull_request:
    # Release Please dispatches tests for its metadata-only changes.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - VERSION
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

concurrency: dream-tests-${{ github.event_name == 'workflow_dispatch' && github.sha || github.run_id }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy: &python-tests
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q -p no:cacheprovider dream

      - name: Verify CLI help
        run: python dream/dream.py --help

      - name: Check installer syntax
        run: bash -n install.sh

  mark-release-tests-pending:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release-please--branches--')
    runs-on: ubuntu-latest
    strategy: *python-tests
    permissions:
      statuses: write
    steps:
      - name: Show the pending test on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT: Dream / Python ${{ matrix.python-version }}
        run: |
          gh api --silent --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f context="$CONTEXT" -f state=pending -f description="Running the Dream test suite" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  report-release-tests:
    needs: [test, mark-release-tests-pending]
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release-please--branches--')
    runs-on: ubuntu-latest
    strategy: *python-tests
    permissions:
      actions: read
      statuses: write
    steps:
      - name: Show the test result on the release PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_JOB: test (${{ matrix.python-version }})
          CONTEXT: Dream / Python ${{ matrix.python-version }}
        run: |
          jobs_url="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100"
          job=$(gh api --paginate "$jobs_url" | jq -cs \
            '[.[].jobs[] | select(.name == env.TEST_JOB)] | max_by(.id)') || job=null
          conclusion=$(jq -r '.conclusion // "unknown"' <<< "$job")
          url=$(jq -r '.html_url // empty' <<< "$job")
          case "$conclusion" in
            success|failure) state="$conclusion" ;;
            *) state=error ;;
          esac
          gh api --silent --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f context="$CONTEXT" -f state="$state" -f description="$TEST_JOB finished: $conclusion" \
            -f target_url="${url:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID}"
