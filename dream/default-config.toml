[storage]
db_path = "~/.claude/dream.db"
memory_root = "~/.claude/projects/__HOME_SLUG__/memory"

[stages.distill]
provider = "codex"
reasoning_effort = "low"
timeout_seconds = 600

[stages.consolidate]
provider = "codex"
reasoning_effort = "high"
timeout_seconds = 1800

[stages.review]
provider = "codex"
model = "gpt-5.6-luna"
reasoning_effort = "high"
timeout_seconds = 1800

# Weekly staleness audit (`dream audit`, dream-audit.timer) over the whole store in chunks.
[stages.audit]
provider = "codex"
reasoning_effort = "high"
timeout_seconds = 1800

[providers.codex]
type = "codex-cli"
auth = "chatgpt-subscription"

[providers.claude]
type = "claude-cli"
# Retry a structured refusal once through the same Claude CLI subscription.
# refusal_fallback_model = "claude-opus-4-8"

# Optional local model server with an OpenAI-compatible API (llama-server,
# Ollama, vLLM). Route a stage to it with provider = "local-qwen". The key is
# read from the named environment variable at call time and may be omitted.
# A non-loopback base_url requires remote_data_egress = true. Never embed a
# token in base_url (it is recorded with each distillation); put keys in the
# variable named by api_key_env. The stage's
# model and timeout_seconds win; the provider's values are defaults. Built-in
# stages always set timeout_seconds, so the provider's timeout_seconds applies
# only when a stage omits it. dream distill --refresh re-runs sessions whose
# provider name, base_url or effective model (the stage's, else this table's)
# changed.
# [providers.local-qwen]
# type = "openai-compatible"
# base_url = "http://127.0.0.1:8080"
# model = "qwen3-32b"
# api_key_env = "LOCAL_LLM_API_KEY"
# remote_data_egress = false
# timeout_seconds = 600

[[sources]]
name = "codex"
type = "codex-jsonl"
root = "~/.codex/sessions"
enabled = true

[[sources]]
name = "opencode"
type = "opencode-sqlite"
root = "~/.local/share/opencode"
enabled = true

[[sources]]
name = "claude-history"
type = "claude-jsonl"
root = "~/.claude/projects"
enabled = false

[review]
mode = "suggest-only"
backup_keep = 14

# "full" sends the whole store nightly (and audits it); "subset" sends MEMORY.md plus
# the subset_files most related topic files and leaves the audit to `dream audit`.
[consolidate]
mode = "full"
subset_files = 15

[recall]
enabled = true
install_hooks = false
allow_raw_transcript_prompt = false
first_prompt_only = true
session_start_budget_codepoints = 18000
prompt_budget_codepoints = 4000
session_start_additional_context_limit = 18000
prompt_additional_context_limit = 1200
diagnostic_path = "~/.cache/dream/recall-diagnostics.jsonl"
calibration_path = "~/.config/dream/recall-calibration.json"
# Harvested recall usage breaks exact ranking ties. Off until a calibrated eval
# shows no regression; harvesting and audit annotations do not depend on it.
usage_tie_break = false

[recall.embedder]
enabled = false
type = "none"
remote_data_egress = false
# A local OpenAI-compatible embedding server (llama-server --embedding or
# Ollama). To use it set enabled = true and type = "openai-compatible", check
# it with `dream preflight`, then run `dream embed`. A non-loopback base_url
# needs remote_data_egress = true. api_key_env names an optional environment
# variable holding a bearer token. timeout_seconds bounds one query embed in
# wall-clock time (at most 3 s; hooks time out after 5 s). Prompts (never
# session starts) use the dense list only after `dream recall-calibrate --fixtures ...
# --mode lexical_plus_embedder --apply` for the current model: rerun it after
# changing model or dimension, and after `dream embed --refresh`.
base_url = "http://127.0.0.1:8081"
model = "bge-m3"
dimension = 1024
timeout_seconds = 1.5
dense_candidates = 200

[recall.reranker]
enabled = false
type = "none"
remote_data_egress = false

[character]
enabled = false
constitution_path = "~/.config/dream/character/constitution.md"
state_root = "~/.local/state/dream/character"
allow_same_family_judge = false
hook_injection = false
render_max_pairs = 3
render_budget_codepoints = 12000
max_context_codepoints = 12000
max_response_codepoints = 8000
max_seed_expansions = 0
# Character snapshots in state_root/backups: one per command run, newest kept.
backup_keep = 14

[stages.character_extract]
provider = "codex"
[stages.character_generate]
provider = "codex"
[stages.character_judge]
provider = "claude"
[stages.character_eval_response]
provider = "codex"
