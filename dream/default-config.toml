[storage]
db_path = "~/.claude/dream.db"
memory_root = "~/.claude/projects/__HOME_SLUG__/memory"

[stages.distill]
provider = "codex"
reasoning_effort = "low"
timeout_seconds = 600

[stages.consolidate]
provider = "codex"
reasoning_effort = "high"
timeout_seconds = 1800

[providers.codex]
type = "codex-cli"
auth = "chatgpt-subscription"

[providers.claude]
type = "claude-cli"

[[sources]]
name = "codex"
type = "codex-jsonl"
root = "~/.codex/sessions"
enabled = true

[[sources]]
name = "claude-history"
type = "claude-jsonl"
root = "~/.claude/projects"
enabled = false

[review]
mode = "suggest-only"
backup_keep = 14

[recall]
enabled = true
install_hooks = false
allow_raw_transcript_prompt = false
first_prompt_only = true
session_start_budget_codepoints = 6000
prompt_budget_codepoints = 4000
session_start_additional_context_limit = 1800
prompt_additional_context_limit = 1200
diagnostic_path = "~/.cache/dream/recall-diagnostics.jsonl"
calibration_path = "~/.config/dream/recall-calibration.json"

[recall.embedder]
enabled = false
type = "none"
remote_data_egress = false

[recall.reranker]
enabled = false
type = "none"
remote_data_egress = false
