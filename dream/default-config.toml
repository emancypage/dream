[storage]
db_path = "~/.claude/dream.db"
memory_root = "~/.claude/projects/__HOME_SLUG__/memory"

[stages.distill]
provider = "codex"
reasoning_effort = "low"
timeout_seconds = 600

[stages.consolidate]
provider = "codex"
reasoning_effort = "high"
timeout_seconds = 1800

[stages.review]
provider = "codex"
model = "gpt-5.6-luna"
reasoning_effort = "high"
timeout_seconds = 1800

[providers.codex]
type = "codex-cli"
auth = "chatgpt-subscription"

[providers.claude]
type = "claude-cli"

# Optional local model server with an OpenAI-compatible API (llama-server,
# Ollama, vLLM). Route a stage to it with provider = "local-qwen". The key is
# read from the named environment variable at call time and may be omitted.
# A non-loopback base_url requires remote_data_egress = true. The stage's
# model and timeout_seconds win; the provider's values are defaults.
# [providers.local-qwen]
# type = "openai-compatible"
# base_url = "http://127.0.0.1:8080"
# model = "qwen3-32b"
# api_key_env = "LOCAL_LLM_API_KEY"
# remote_data_egress = false
# timeout_seconds = 600

[[sources]]
name = "codex"
type = "codex-jsonl"
root = "~/.codex/sessions"
enabled = true

[[sources]]
name = "opencode"
type = "opencode-sqlite"
root = "~/.local/share/opencode"
enabled = true

[[sources]]
name = "claude-history"
type = "claude-jsonl"
root = "~/.claude/projects"
enabled = false

[review]
mode = "suggest-only"
backup_keep = 14

[recall]
enabled = true
install_hooks = false
allow_raw_transcript_prompt = false
first_prompt_only = true
session_start_budget_codepoints = 18000
prompt_budget_codepoints = 4000
session_start_additional_context_limit = 18000
prompt_additional_context_limit = 1200
diagnostic_path = "~/.cache/dream/recall-diagnostics.jsonl"
calibration_path = "~/.config/dream/recall-calibration.json"

[recall.embedder]
enabled = false
type = "none"
remote_data_egress = false

[recall.reranker]
enabled = false
type = "none"
remote_data_egress = false

[character]
enabled = false
constitution_path = "~/.config/dream/character/constitution.md"
state_root = "~/.local/state/dream/character"
allow_same_family_judge = false
hook_injection = false
render_max_pairs = 3
render_budget_codepoints = 12000
max_context_codepoints = 12000
max_response_codepoints = 8000
max_seed_expansions = 0

[stages.character_extract]
provider = "codex"
[stages.character_generate]
provider = "codex"
[stages.character_judge]
provider = "claude"
[stages.character_eval_response]
provider = "codex"
