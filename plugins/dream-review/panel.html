<style>

*{box-sizing:border-box}body{margin:0;background:var(--night);color:var(--paper);font:15px/1.55 var(--font)}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px 14px}button:hover:not(:disabled){background:var(--raised)}button:disabled{opacity:.45;cursor:default}button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button.primary{background:var(--blue);border-color:var(--blue);color:#102139;font-weight:650}button.primary:hover:not(:disabled){background:#a5cbff}button.quiet{border-color:transparent;color:var(--muted)}[hidden]{display:none!important}h1,h2,h3,p{margin:0}h1{font-size:22px;font-weight:650;letter-spacing:-.6px}h2{font-size:21px;letter-spacing:-.35px}h3{font-size:15px;font-weight:650}.app{padding:24px max(20px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));max-width:1600px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.brand svg{color:var(--blue);width:32px;height:32px}.subtitle{color:var(--muted);font-size:13px;margin-top:2px}.tabs{display:flex;gap:6px;margin-top:26px;border-bottom:1px solid var(--line)}.tab{border:0;border-radius:6px 6px 0 0;padding:12px 15px;color:var(--muted);position:relative}.tab[aria-selected=true]{color:var(--paper);background:var(--surface)}.tab[aria-selected=true]:after{content:"";position:absolute;bottom:-1px;left:15px;right:15px;height:3px;background:var(--blue)}.count{margin-left:8px;font-variant-numeric:tabular-nums;color:var(--muted)}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:30px;margin-top:24px}.rail{min-width:0}.rail-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.small{font-size:12px;color:var(--muted)}.queue{display:grid;gap:5px}.queue-item{text-align:left;border-color:transparent;border-radius:7px;padding:12px;width:100%}.queue-item[aria-current=true]{background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 var(--blue)}.queue-title{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.5;overflow-wrap:anywhere}.queue-state{display:block;font-size:11px;color:var(--muted);margin-top:5px}.batch-note{margin-top:15px;color:var(--muted);font-size:12px}.rail-footer{margin-top:18px}.workspace{min-width:0}.work-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:18px}.progress{display:flex;gap:5px;margin-bottom:16px}.progress span{height:4px;flex:1;background:var(--line);border-radius:3px}.progress span.done{background:var(--blue)}.prompt{margin:0 0 20px;padding:18px 20px;background:var(--surface);border-radius:10px}.prompt h3{color:var(--muted);font-weight:500;margin-bottom:9px}.prompt-text{white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;line-height:1.65}.conversation{margin-top:12px;color:var(--muted)}summary{cursor:pointer;font-size:13px;padding:7px 0;width:fit-content}.message{margin:12px 0;padding-left:14px;border-left:2px solid var(--line)}.message strong{display:block;font-size:12px;color:var(--blue);margin-bottom:6px}.message p{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--paper)}.answers{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}.answer{min-width:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}.answer.selected{border-color:var(--blue);box-shadow:inset 4px 0 var(--blue)}.answer-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);gap:10px}.answer-head h3{font-size:14px}.answer-head button{padding:6px 12px;min-width:92px}.answer.selected .answer-head button{background:var(--blue);border-color:var(--blue);color:var(--night)}.answer-text{font:17px/1.7 Charter,"Bitstream Charter",Georgia,serif;white-space:pre-wrap;overflow-wrap:anywhere;padding:22px;max-width:76ch;tab-size:2}.alternative{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}.alternative button[aria-pressed=true]{border-color:var(--blue);background:var(--raised)}.reason-block{margin-top:22px;display:grid;gap:8px}.reason-block label{font-weight:600;font-size:14px}textarea{width:100%;resize:vertical;min-height:90px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--night);color:var(--paper);line-height:1.6}textarea::placeholder{color:#91a2bc}.model{margin-top:15px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted)}.model p{font-size:13px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.notice{border-left:3px solid var(--warning);padding:12px 16px;background:#2b2e37;color:var(--warning);margin:16px 0;border-radius:0 6px 6px 0;font-size:13px}.notice p+p{margin-top:7px}.notice label{display:flex;gap:10px;align-items:start;margin-top:10px;color:var(--paper)}input[type=checkbox]{accent-color:var(--blue);margin-top:5px;width:17px;height:17px;flex-shrink:0}.footer{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}.footer .small{max-width:45ch}.error{background:#352638;color:var(--danger);padding:13px 16px;border:1px solid #6a424e;border-radius:8px;margin-top:16px;white-space:pre-wrap;overflow-wrap:anywhere}.status{margin-top:16px;min-height:24px;font-size:13px;color:var(--muted)}.empty{padding:55px 25px;max-width:65ch}.empty h2{margin-bottom:10px}.empty p{color:var(--muted);margin-bottom:16px}.short-fields{display:grid;gap:22px;margin-top:20px;max-width:80ch}.short-field label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.short-field p{font:18px/1.7 Charter,"Bitstream Charter",Georgia,serif;white-space:pre-wrap;overflow-wrap:anywhere}.short-field textarea{min-height:120px}.short-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.identity{margin-top:20px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.identity code{font-family:inherit}.loading{color:var(--muted);padding:45px 0}.skeleton{height:100px;background:var(--surface);border-radius:10px;margin-top:20px}.hint{margin-top:8px;font-size:12px;color:var(--muted)}.next-batch{margin:25px 0}.result-title{color:var(--blue)}
@media(max-width:1150px){.layout{grid-template-columns:1fr;gap:22px}.rail-head{margin-bottom:7px}.queue{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px}.queue-item{flex:0 0 160px}.queue-title{-webkit-line-clamp:2}.rail-footer{margin-top:8px}.batch-note{display:none}.answers{gap:12px}.answer-text{padding:18px}.rail-head h3{font-size:13px}.queue-state{display:none}}
@media(max-width:650px){.app{padding:18px 14px 28px}.answers{grid-template-columns:1fr;gap:16px}.tabs{margin-top:20px}.tab{padding:11px 12px}.count{margin-left:5px}.top{gap:8px}.brand{gap:8px}.brand svg{width:26px;height:26px}h1{font-size:20px}.subtitle{font-size:12px}.answer-text{font-size:17px}.work-head{margin-bottom:13px}.footer{align-items:stretch}.footer .primary{width:100%}.prompt{padding:15px}.queue-item{flex-basis:145px}}

<body>
<main class="app">
  <header class="top"><div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 6h14v18H5zM13 10h14v18H13" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m9 13 2 2 4-4M17 18h6m-6 4h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><div><h1>Dream Review</h1><p class="subtitle">Ty wybierasz, jak ma odpowiadać Dream.</p></div></div><button id="refresh" type="button">Odśwież</button></header>
  <nav class="tabs" role="tablist" aria-label="Kolejki do oceny"><button class="tab" role="tab" id="tab-pairs" aria-selected="true" aria-controls="workspace">Pary<span class="count" id="pairs-count">…</span></button><button class="tab" role="tab" id="tab-shorts" aria-selected="false" aria-controls="workspace">Skróty<span class="count" id="shorts-count">…</span></button><button class="tab" role="tab" id="tab-history" aria-selected="false" aria-controls="workspace">Historia<span class="count" id="history-count">…</span></button></nav>
  <div id="error" class="error" role="alert" hidden></div>
  <p id="status" class="status" role="status" aria-live="polite">Łączę z lokalnym Dream…</p>
  <div class="layout"><aside class="rail" id="rail" hidden><div class="rail-head"><h3 id="batch-title">Twoje następne 5</h3><span class="small" id="batch-position"></span></div><div class="queue" id="queue"></div><p class="batch-note">Mała partia wystarczy. Możesz wrócić do reszty później.</p><div class="rail-footer"><button id="next-batch" class="quiet" hidden>Wczytaj kolejne 5</button></div></aside><section id="workspace" class="workspace" role="tabpanel" aria-labelledby="tab-pairs"><div class="loading">Wczytuję kolejkę…<div class="skeleton"></div></div></section></div>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const fields = {situation:'Sytuacja',preferred:'Preferowana odpowiedź',avoid:'Czego unikać',feedback:'Dlaczego taki wybór',limits:'Granice tego przykładu'};
const states = {pending:'Do oceny',edited:'Poprawione',accepted:'Zaakceptowane',rejected:'Odrzucone',deferred:'Odłożone',stale:'Nieaktualne',needs_evidence:'Wymaga sprawdzenia problemu',draft:'Do zatwierdzenia',approved:'Zatwierdzone'};
let queue=null, item=null, tab='pairs', batch=[], selectedId=null, busy=false, loading=0, sequence=0, choice='', editing=false, batchSaved=0, pageOffset=0;
const pending=new Map();
const node=(tag, cls, text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
function store(key,value){try{localStorage.setItem('dream-review:'+key,JSON.stringify(value));}catch(_){}}
function stored(key){try{return JSON.parse(localStorage.getItem('dream-review:'+key));}catch(_){return null;}}
function draftKey(){return item?item.id+':'+item.content_sha256:'';}
function forget(key){try{localStorage.removeItem('dream-review:'+key);}catch(_){}}
function saveInput(){if(!item)return;const previous=stored(draftKey())||{};const body={...(previous.body||{})};for(const k of Object.keys(fields)){const n=$('field-'+k);if(n)body[k]=n.value;}store(draftKey(),{choice,reason:$('reason')?$('reason').value:previous.reason||'',ack:$('ack')?$('ack').checked:previous.ack||false,deletion_reason:$('deletion-reason')?$('deletion-reason').value:previous.deletion_reason||'',body});}
function request(method,params){return new Promise((resolve,reject)=>{const id=++sequence;const timer=setTimeout(()=>{pending.delete(id);reject(new Error('Brak odpowiedzi. Wybór mógł zostać zapisany. Kliknij Odśwież i sprawdź Historię przed ponownym zapisem.'));},660000);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
function notify(method,params={}){window.parent.postMessage({jsonrpc:'2.0',method,params},'*');}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);clearTimeout(p.timer);pending.delete(m.id);m.error?p.reject(new Error(m.error.message||'Nie udało się połączyć z Dream.')):p.resolve(m.result);}if(m.method==='ui/notifications/host-context-changed')applyHost(m.params);if(m.method==='ping'&&m.id!==undefined)window.parent.postMessage({jsonrpc:'2.0',id:m.id,result:{}},'*');});
function applyHost(context={}){for(const [key,value] of Object.entries(context.styles?.variables||{}))if(value&&key.startsWith('--'))document.documentElement.style.setProperty(key,value);const insets=context.safeAreaInsets||{};for(const [side,size] of Object.entries(insets))if(['top','right','bottom','left'].includes(side)&&Number.isFinite(size))document.documentElement.style.setProperty('--safe-'+side,size+'px');}
async function call(name,args={}){const result=await request('tools/call',{name,arguments:args});if(result.isError)throw new Error(result.content?.find(c=>c.type==='text')?.text||'Dream nie zapisał decyzji.');return result.structuredContent;}
function showError(error){const message=error.message||String(error);$('error').textContent=message.includes('[Dream paused]')?'Dream jest wstrzymany. Wznów go, gdy zechcesz wrócić do oceny.':message.includes('active WAL')?'Dream zapisuje teraz dane. Poczekaj chwilę i kliknij Odśwież.':message.includes('acknowledgement')?'Potwierdź widoczne zastrzeżenia przed zapisem.':message.includes('changed')||message.includes('display')?'Ten przykład zmienił się od otwarcia. Kliknij Odśwież, przeczytaj aktualną wersję i wybierz ponownie.':message;$('error').hidden=false;$('status').textContent='';}
function controls(){document.querySelectorAll('button,textarea,input').forEach(n=>{n.disabled=busy||n.dataset.blocked==='true';});}
function rows(){return queue?.[tab]||[];}
function updateCounts(){for(const k of ['pairs','shorts','history'])$(k+'-count').textContent=queue?.[k]?.length??0;}
function summaryFor(id){return rows().find(r=>r.id===id);}
function setBatch(offset=0){pageOffset=offset;batch=rows().slice(offset,offset+5).map(r=>r.id);batchSaved=0;}
function nextBatchOffset(){const last=batch[batch.length-1];const index=rows().findIndex(row=>row.id===last);return index<0?pageOffset:index+1;}
function renderRail(){const target=$('queue');target.replaceChildren();$('rail').hidden=!batch.length;const ids=batch.filter(id=>summaryFor(id));$('batch-position').textContent=(selectedId?ids.indexOf(selectedId)+1:0)+' / '+ids.length;$('batch-title').textContent=tab==='history'?'Ostatnie decyzje':'Na teraz';for(const id of ids){const row=summaryFor(id);const b=node('button','queue-item');b.setAttribute('aria-current',String(id===selectedId));b.append(node('span','queue-title',row.title||'Przykład odpowiedzi'),node('span','queue-state',states[row.status]||row.status));b.onclick=()=>openItem(id);target.append(b);}const remaining=rows().length>nextBatchOffset();$('next-batch').hidden=!remaining;$('next-batch').textContent=tab==='history'?'Pokaż kolejne 5':'Następna partia';controls();}
async function refresh(keep=true){if(busy)return;const ticket=++loading;try{$('error').hidden=true;$('status').textContent='Wczytuję aktualną kolejkę…';const next=await call('get_queue');if(ticket!==loading)return;queue=next;updateCounts();if(!keep||!batch.length)setBatch();else batch=batch.filter(id=>summaryFor(id));if(!batch.length&&rows().length)setBatch();const remembered=stored('position');const id=batch.includes(selectedId)?selectedId:batch.includes(remembered?.id)?remembered.id:batch[0];if(id)await openItem(id);else renderEmpty();$('status').textContent='Kolejka jest aktualna.';}catch(e){showError(e);}}
async function selectTab(next){if(busy)return;saveInput();tab=next;selectedId=null;item=null;for(const k of ['pairs','shorts','history']){$('tab-'+k).setAttribute('aria-selected',String(k===tab));$('tab-'+k).tabIndex=k===tab?0:-1;}$('workspace').setAttribute('aria-labelledby','tab-'+tab);setBatch();if(batch.length)await openItem(batch[0]);else renderEmpty();}
async function openItem(id){if(busy)return;saveInput();const row=summaryFor(id);if(!row)return;const ticket=++loading;selectedId=id;item=null;renderRail();$('workspace').replaceChildren(node('p','loading','Wczytuję pełną treść…'));try{const next=await call('get_item',{kind:row.kind,id});if(ticket!==loading)return;item=next;editing=false;choice=stored(draftKey())?.choice||'';store('position',{tab,id});renderItem();controls();}catch(e){showError(e);}}
function renderEmpty(){item=null;selectedId=null;renderRail();const box=node('div','empty');const hasMore=rows().length>0;box.append(node('h2','',hasMore?'Ta partia jest gotowa.':tab==='shorts'?'Brak skrótów do zatwierdzenia.':tab==='history'?'Nie ma jeszcze decyzji.':'Nie ma teraz par do oceny.'));let text=tab==='shorts'?'Po zaakceptowaniu pary Dream przygotuje skrót. Przeczytasz go tutaj i zatwierdzisz osobno.':'Możesz wrócić później. Zapisane decyzje znajdziesz w Historii.';if(hasMore)text='Zapisano '+batchSaved+' decyzji w tej partii. Możesz zakończyć albo wczytać następne 5.';if(tab==='shorts'&&queue?.counts.stale_shorts)text+=' Nieaktualne skróty: '+queue.counts.stale_shorts+'. Znajdziesz je w Historii.';box.append(node('p','',text));if(hasMore){const b=node('button','primary','Wczytaj kolejne 5');b.onclick=()=>{setBatch();openItem(batch[0]);};box.append(b);}$('workspace').replaceChildren(box);}
function identity(target){const details=node('details','identity');details.append(node('summary','','Wersja i identyfikator'));details.append(node('p','',item.id),node('code','',item.content_sha256));target.append(details);}
function warning(target,text){const n=node('div','notice',text);target.append(n);return n;}
function renderItem(){const target=$('workspace');target.replaceChildren();const head=node('div','work-head');head.append(node('h2','',tab==='history'?(states[item.status]||item.status):summaryFor(item.id)?.kind==='short'?'Sprawdź krótki przykład':'Która odpowiedź lepiej Ci służy?'));if(summaryFor(item.id)?.kind==='pair'){const remove=node('button','','Usuń parę na zawsze');remove.onclick=deletePair;head.append(remove);}target.append(head);if(summaryFor(item.id)?.kind==='pair')renderDeletionReason(target);if(item.status==='needs_evidence')warning(target,'Ta para wymaga ponownego sprawdzenia, czy dotyczy konkretnego problemu w komunikacji. Nie trafia do głównej kolejki. Możesz ją usunąć.');if(item.status==='stale')warning(target,'Ten przykład jest nieaktualny. Zmieniła się konstytucja lub jego źródło. Wymaga ponownego przygotowania przed oceną.');if(summaryFor(item.id)?.kind==='short')renderShort(target);else renderPair(target);identity(target);renderRail();}
function renderDeletionReason(target){
const details=node('details','conversation');details.append(node('summary','','Powód usunięcia (opcjonalnie)'));
const label=node('label','','Co straciło znaczenie?');label.htmlFor='deletion-reason';
const input=node('textarea');input.id='deletion-reason';input.maxLength=2000;
input.placeholder='Np. Projekt X jest zamknięty. Nie chcę już zachowywać w pamięci jego planów i zadań.';
input.value=stored(draftKey())?.deletion_reason||'';input.oninput=saveInput;details.open=Boolean(input.value);
details.append(label,input,node('p','hint','Powód i krótki kontekst trafią do kolejnego porządkowania pamięci Dream. Napisz, czy chodzi tylko o ocenę pary, czy także o jej temat w pamięci.'));
target.append(details);
}
function conversation(target){const messages=item.prompt_messages||[];const last=[...messages].reverse().find(m=>m.role==='user');const context=node('section','prompt');context.append(node('h3','','Twoje pytanie'),node('div','prompt-text',last?.content||'Przykład nie zawiera pytania.'));const details=node('details','conversation');details.append(node('summary','','Pełny kontekst rozmowy'));for(const m of messages){const article=node('div','message');article.append(node('strong','',({user:'Ty',assistant:'Asystent',system:'Kontekst'})[m.role]||m.role),node('p','',m.content));details.append(article);}context.append(details);target.append(context);}
function reviewablePair(){return ['pending','edited','deferred'].includes(item.status);}
function renderPair(target){conversation(target);if(item.user_feedback){const feedback=node('section','prompt');feedback.append(node('h3','','Twoja uwaga do poprzedniej odpowiedzi'),node('div','prompt-text',item.user_feedback));target.append(feedback);}const answers=node('div','answers');for(const [side,label,key] of [['left','A','chosen'],['right','B','rejected']]){const section=node('article','answer'+(choice===side?' selected':''));section.id='answer-'+side;const head=node('div','answer-head');head.append(node('h3','','Odpowiedź '+label));if(reviewablePair()){const b=node('button','',choice===side?'Wybrana '+label:'Wybieram '+label);b.onclick=()=>choose(side);b.dataset.blocked=String(!item.can_accept);head.append(b);}section.append(head,node('div','answer-text',item[key]));answers.append(section);}target.append(answers);if(!reviewablePair()){if(item.accepted_answer)target.append(node('p','hint','Twój wybór: odpowiedź '+(item.accepted_answer==='left'?'A':'B')+'.'));const event=[...(item.review_events||[])].sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).find(e=>e.reason);if(event)target.append(node('p','hint','Uzasadnienie: '+event.reason));if(item.can_prepare_short){const retry=node('button','','Przygotuj skrót');retry.onclick=prepareShort;target.append(retry);}return;}if(!item.can_accept)warning(target,'Ta para nie ma aktualnej, pełnej oceny modelu. Możesz ją odrzucić lub odłożyć. Wybór A/B będzie możliwy po ponownej ocenie.');const alt=node('div','alternative');for(const [value,label] of [['reject','Żadna z nich'],['defer','Odłóż na później']]){const b=node('button','',label);b.id='choose-'+value;b.setAttribute('aria-pressed',String(choice===value));b.onclick=()=>choose(value);alt.append(b);}target.append(alt);renderReason(target);const model=node('details','model');model.id='model';model.hidden=!choice;model.append(node('summary','','Zobacz ocenę modelu'));for(const j of item.current_judgments||[]){const label=({chosen:'Model wskazuje odpowiedź A.',rejected:'Model wskazuje odpowiedź B.',inconsistent:'Ocena modelu jest niespójna.',tie:'Model ocenia odpowiedzi podobnie.',neither:'Model nie wybiera żadnej odpowiedzi.'})[j.normalized_result]||'Brak jednoznacznej oceny.';model.append(node('p','',label));if(j.rationale)model.append(node('p','',typeof j.rationale==='string'?j.rationale:JSON.stringify(j.rationale)));}target.append(model);const flags=node('div','notice');flags.id='flags';flags.hidden=true;const text=node('p');text.id='flags-text';const label=node('label');const ack=node('input');ack.id='ack';ack.type='checkbox';ack.checked=stored(draftKey())?.ack||false;ack.onchange=saveInput;label.append(ack,document.createTextNode('Rozumiem te zastrzeżenia i podtrzymuję swój wybór.'));flags.append(text,label);target.append(flags);renderFooter(target,'Wybór zapisze się w Dream. Skrót zatwierdzisz osobno.');updateChoice();}
function renderReason(target){const wrap=node('div','reason-block');const label=node('label','','Dlaczego tak wybierasz?');label.htmlFor='reason';const input=node('textarea');input.id='reason';input.maxLength=2000;input.placeholder='Jedno zdanie wystarczy. Co ta odpowiedź robi dobrze albo źle?';input.value=stored(draftKey())?.reason||'';input.oninput=saveInput;wrap.append(label,input);target.append(wrap);}
function requiredFlags(){if(!['left','right'].includes(choice))return [];const flags=[];if(item.conflict)flags.push('Przykład ma oznaczony konflikt.');if((item.current_judgments||[]).some(j=>j.normalized_result==='inconsistent'))flags.push('Oceny modelu nie są zgodne.');const expected=choice==='left'?'chosen':'rejected';if((item.current_judgments||[]).some(j=>j.normalized_result!==expected&&j.normalized_result!=='inconsistent'))flags.push('Twój wybór różni się od oceny modelu.');return flags;}
function choose(value){if(busy)return;if(choice!==value&&$('ack'))$('ack').checked=false;choice=value;saveInput();updateChoice();}
function updateChoice(){for(const side of ['left','right']){const n=$('answer-'+side);n?.classList.toggle('selected',choice===side);const button=n?.querySelector('button');if(button)button.textContent=choice===side?'Wybrana '+(side==='left'?'A':'B'):'Wybieram '+(side==='left'?'A':'B');}for(const c of ['reject','defer'])$('choose-'+c)?.setAttribute('aria-pressed',String(choice===c));if($('model'))$('model').hidden=!choice;const flags=requiredFlags();if($('flags')){$('flags').hidden=!flags.length;$('flags-text').textContent=flags.join(' ');}}
function renderFooter(target,note){const footer=node('div','footer');footer.append(node('p','small',note));const b=node('button','primary','Zapisz i przejdź dalej');b.id='save';b.onclick=saveDecision;footer.append(b);target.append(footer);target.append(node('p','hint','Skróty: A lub B — wybór odpowiedzi. Ctrl+Enter — zapis.'));}
function renderShort(target){const draft=stored(draftKey());target.append(node('p','subtitle','Zatwierdzasz dokładnie tę treść. Dopiero wtedy może trafić do nowych rozmów.'));const fieldsNode=node('div','short-fields');for(const [key,label] of Object.entries(fields)){const block=node('div','short-field');const l=node('label','',label);l.htmlFor='field-'+key;block.append(l);if(editing){const input=node('textarea');input.id='field-'+key;input.value=draft?.body?.[key]||item.body[key];input.oninput=saveInput;block.append(input);}else block.append(node('p','',item.body[key]));fieldsNode.append(block);}target.append(fieldsNode);if(item.status!=='draft'){const event=[...(item.review_events||[])].reverse().find(e=>e.reason);if(event)target.append(node('p','hint','Uzasadnienie: '+event.reason));return;}const actions=node('div','short-actions');if(editing){const save=node('button','primary','Zapisz poprawiony szkic');save.onclick=saveShortEdit;const cancel=node('button','','Wróć do treści');cancel.onclick=()=>{saveInput();editing=false;renderItem();};actions.append(save,cancel);target.append(actions);warning(target,'Zmiany zapiszą się jako szkic. Po ich zapisie przeczytaj całość i zatwierdź nową wersję osobno.');return;}const edit=node('button','','Popraw treść');edit.onclick=()=>{saveInput();editing=true;renderItem();};actions.append(edit);target.append(actions);const choices=node('div','alternative');for(const [value,label] of [['approve','Zatwierdzam ten skrót'],['reject','Odrzucam ten skrót']]){const b=node('button','',label);b.setAttribute('aria-pressed',String(choice===value));b.onclick=()=>{choice=value;saveInput();renderItem();};choices.append(b);}target.append(choices);renderReason(target);renderFooter(target,'Zatwierdzenie dotyczy tylko tej wersji skrótu.');}
async function saveDecision(){if(busy||!item)return;const kind=summaryFor(item.id)?.kind;const reason=$('reason')?.value.trim();if(!choice){showError(new Error('Najpierw wybierz odpowiedź lub decyzję.'));return;}if(!reason){showError(new Error('Dodaj krótkie uzasadnienie wyboru.'));$('reason')?.focus();return;}if(kind==='pair'&&requiredFlags().length&&!$('ack').checked){showError(new Error('Potwierdź widoczne zastrzeżenia przed zapisem.'));return;}saveInput();busy=true;controls();$('error').hidden=true;$('status').textContent=kind==='pair'&&['left','right'].includes(choice)?'Zapisuję Twój wybór i przygotowuję szkic skrótu…':'Zapisuję decyzję…';const previous=item.id;const inputKey=draftKey();let persisted=false;try{const result=await call('save_decision',{kind,id:item.id,expected_sha:item.content_sha256,choice,reason,acknowledge_flags:$('ack')?.checked||false,view_token:item.view_token});persisted=Boolean(result.saved);if(persisted)forget(inputKey);const next=await call('get_queue');queue=next;updateCounts();batch=batch.filter(id=>id!==previous&&summaryFor(id));batchSaved++;busy=false;item=null;choice='';if(batch.length)await openItem(batch[0]);else renderEmpty();if(result.short_draft?.failures){$('status').textContent='Wybór został zapisany. Nie udało się przygotować skrótu. Pełna para jest w Historii.';showError(new Error('Zapisano wybór, ale przygotowanie skrótu nie powiodło się. Nie zapisuj tej decyzji ponownie.'));;}else $('status').textContent=result.short_draft?.skipped?'Decyzja zapisana. Dream pominął przygotowanie szkicu skrótu.':result.short_draft?'Wybór zapisany. Nowy skrót czeka w zakładce Skróty.':'Decyzja zapisana w Dream.';}catch(e){if(persisted){item=null;$('workspace').replaceChildren(node('h2','result-title','Decyzja została zapisana.'));showError(new Error('Decyzja została zapisana, ale nie udało się odświeżyć widoku. Kliknij Odśwież.'));}else showError(e);}finally{busy=false;controls();}}
async function deletePair(){
if(busy||!item)return;
const id=item.id, sha=item.content_sha256, token=item.view_token, reason=$('deletion-reason')?.value.trim()||'';
saveInput();
busy=true;controls();$('error').hidden=true;$('status').textContent='Usuwam parę i blokuję jej powrót…';
let persisted=false;
try{
const result=await call('delete_pair',{id,expected_sha:sha,view_token:token,reason});
persisted=Boolean(result.deleted);
if(persisted){try{for(const key of Object.keys(localStorage))if(key.startsWith('dream-review:'+id+':'))localStorage.removeItem(key);}catch(_){} }
item=null;choice='';queue=await call('get_queue');updateCounts();batch=batch.filter(key=>key!==id&&summaryFor(key));batchSaved++;busy=false;
if(batch.length)await openItem(batch[0]);else renderEmpty();
$('status').textContent=reason?'Para usunięta. Powód zostanie uwzględniony przy porządkowaniu pamięci.':'Para usunięta. Nie wróci do oceny.';
}catch(e){if(persisted){item=null;$('workspace').replaceChildren(node('h2','result-title','Para została usunięta.'));showError(new Error('Para została usunięta, ale widok wymaga odświeżenia. Kliknij Odśwież.'));}else showError(e);}
finally{busy=false;controls();}
}
async function prepareShort(){if(busy||!item)return;busy=true;controls();$('status').textContent='Przygotowuję szkic skrótu…';try{const result=await call('prepare_short',{id:item.id,expected_sha:item.content_sha256,view_token:item.view_token});busy=false;await refresh();if(result.short_draft?.failures)showError(new Error('Przygotowanie skrótu nie powiodło się. Twój zapisany wybór pozostaje w Historii.'));else $('status').textContent='Szkic przygotowany. Otwórz zakładkę Skróty i oceń jego treść.';}catch(e){showError(e);}finally{busy=false;controls();}}
async function saveShortEdit(){if(busy||!item)return;const body={};for(const k of Object.keys(fields))body[k]=$('field-'+k).value;const count=Object.values(body).reduce((n,s)=>n+[...s].length,0);if(Object.values(body).some(s=>!s.trim())||count>2500){showError(new Error('Uzupełnij wszystkie pola. Cały skrót może mieć najwyżej 2500 znaków.'));return;}saveInput();const inputKey=draftKey();busy=true;controls();try{await call('edit_short',{id:item.id,expected_sha:item.content_sha256,expected_pair_sha:item.pair_sha256,body,view_token:item.view_token});forget(inputKey);busy=false;const id=item.id;item=null;await openItem(id);$('status').textContent='Poprawiony szkic zapisany. Przeczytaj go i zatwierdź osobno.';}catch(e){showError(e);}finally{busy=false;controls();}}
$('refresh').onclick=()=>refresh();for(const k of ['pairs','shorts','history'])$('tab-'+k).onclick=()=>selectTab(k);$('next-batch').onclick=()=>{setBatch(nextBatchOffset());if(batch.length)openItem(batch[0]);};
document.addEventListener('keydown',event=>{if(busy||!item)return;const input=['TEXTAREA','INPUT','SELECT'].includes(event.target.tagName);if((event.ctrlKey||event.metaKey)&&event.key==='Enter'&&!editing){event.preventDefault();saveDecision();}else if(!input&&!editing&&summaryFor(item.id)?.kind==='pair'&&item.can_accept&&['a','b'].includes(event.key.toLowerCase())){event.preventDefault();choose(event.key.toLowerCase()==='a'?'left':'right');}});
async function start(){try{const host=await request('ui/initialize',{appInfo:{name:'Dream Review',version:'0.1.6'},appCapabilities:{availableDisplayModes:['inline','fullscreen']},protocolVersion:'2026-01-26'});applyHost(host.hostContext);if(!host.hostCapabilities?.serverTools)throw new Error('Ten widok wymaga obsługi MCP Apps. Zaktualizuj Codex i otwórz plugin ponownie.');notify('ui/notifications/initialized');const position=stored('position');if(['pairs','shorts','history'].includes(position?.tab)){tab=position.tab;for(const k of ['pairs','shorts','history'])$('tab-'+k).setAttribute('aria-selected',String(k===tab));}await refresh(false);}catch(e){showError(e);}}
start();
</script>
